name: Build Release APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/lifeclock-release.keystore
          ls -la app/lifeclock-release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK to site downloads
        run: |
          mkdir -p ../downloads
          cp app/build/outputs/apk/release/app-release.apk ../downloads/lifeclock-release.apk

      - name: Commit APK to repo (for GitHub Pages hosting)
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/lifeclock-release.apk
          if git diff --staged --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "Update release APK (auto-build)"
            git push
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeclock-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
