name: Submit URLs to Google Indexing API

on:
  # Only run when blog content changes (not every day)
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'index.html'
      - 'faq.html'
      - 'about.html'
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install google-auth google-api-python-client
      
      - name: Submit changed URLs to Indexing API
        env:
          GSC_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GSC_KEY" > /tmp/gsc-key.json
          python3 << 'PYTHON'
          import json, os, time, subprocess
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          # Get list of changed files in this commit
          result = subprocess.run(
              ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'],
              capture_output=True, text=True
          )
          changed_files = result.stdout.strip().split('\n') if result.stdout.strip() else []

          # Map file paths to URLs
          SITE = 'https://creativewavecom.github.io/lifeclock'
          url_map = {
              'index.html': f'{SITE}/',
              'faq.html': f'{SITE}/faq.html',
              'about.html': f'{SITE}/about.html',
          }
          # Blog posts
          for f in changed_files:
              if f.startswith('blog/') and f.endswith('.html'):
                  slug = f.replace('blog/', '').replace('.html', '')
                  url_map[f] = f'{SITE}/blog/{slug}.html'

          # Also submit sitemap.xml if changed
          if 'sitemap.xml' in changed_files:
              url_map['sitemap.xml'] = None  # just resubmit sitemap

          # If no relevant files changed, submit all (for manual trigger)
          relevant = [f for f in changed_files if f in url_map]
          if not relevant and os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              # Manual trigger: submit all pages
              relevant = list(url_map.keys())

          if not relevant:
              print("No relevant files changed. Skipping.")
              exit(0)

          credentials = service_account.Credentials.from_service_account_file(
              '/tmp/gsc-key.json',
              scopes=['https://www.googleapis.com/auth/indexing']
          )
          indexing_service = build('indexing', 'v3', credentials=credentials)

          submitted = 0
          for f in relevant:
              url = url_map.get(f)
              if not url:
                  continue
              try:
                  result = indexing_service.urlNotifications().publish(
                      body={'url': url, 'type': 'URL_UPDATED'}
                  ).execute()
                  print(f"✓ {url}")
                  submitted += 1
              except HttpError as e:
                  print(f"✗ {url}: {e._get_reason()}")
              time.sleep(0.5)
          
          print(f"\n{submitted} pages submitted for indexing")

          # Resubmit sitemap
          print("\n=== Resubmitting sitemap ===")
          webmasters_creds = service_account.Credentials.from_service_account_file(
              '/tmp/gsc-key.json',
              scopes=['https://www.googleapis.com/auth/webmasters']
          )
          webmasters = build('webmasters', 'v3', credentials=webmasters_creds)
          SITE_URL = f'{SITE}/'
          try:
              webmasters.sitemaps().submit(
                  siteUrl=SITE_URL,
                  feedpath=f'{SITE}/sitemap.xml'
              ).execute()
              print("✓ Sitemap resubmitted")
          except HttpError as e:
              print(f"✗ Sitemap: {e._get_reason()}")
          PYTHON

      - name: Clean up
        run: rm -f /tmp/gsc-key.json
        if: always()
