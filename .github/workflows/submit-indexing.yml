name: Submit URLs to Google Indexing API

on:
  schedule:
    # Run every day at 6 AM UTC (9:30 AM Tehran time)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install google-auth google-api-python-client
      
      - name: Create service account key
        run: |
          echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > /tmp/key.json
          # Wait, that's the keystore. We need a different secret.
          # Let's use a dedicated secret for the GSC service account.
      
      - name: Submit URLs to Indexing API
        env:
          GSC_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GSC_KEY" > /tmp/gsc-key.json
          python3 << 'PYTHON'
          import json, time
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          with open('/tmp/gsc-key.json') as f:
              key_data = f.read()
          
          # Save key to file
          with open('/tmp/gsc-key-file.json', 'w') as f:
              f.write(key_data)
          
          credentials = service_account.Credentials.from_service_account_file(
              '/tmp/gsc-key-file.json',
              scopes=['https://www.googleapis.com/auth/indexing']
          )
          indexing_service = build('indexing', 'v3', credentials=credentials)

          pages = [
              'https://creativewavecom.github.io/lifeclock/',
              'https://creativewavecom.github.io/lifeclock/faq.html',
              'https://creativewavecom.github.io/lifeclock/about.html',
              'https://creativewavecom.github.io/lifeclock/blog/what-is-life-clock.html',
              'https://creativewavecom.github.io/lifeclock/blog/benefits.html',
              'https://creativewavecom.github.io/lifeclock/blog/circadian-rhythm.html',
              'https://creativewavecom.github.io/lifeclock/blog/sun-time-vs-clock-time.html',
              'https://creativewavecom.github.io/lifeclock/blog/prayer-times-and-life-clock.html',
              'https://creativewavecom.github.io/lifeclock/blog/implementing-offline.html',
              'https://creativewavecom.github.io/lifeclock/blog/tehran-prayer-times.html',
              'https://creativewavecom.github.io/lifeclock/blog/converter-guide.html',
              'https://creativewavecom.github.io/lifeclock/blog/solar-time-guide.html',
              'https://creativewavecom.github.io/lifeclock/blog/sunrise-sunset-tehran.html',
              'https://creativewavecom.github.io/lifeclock/blog/fasting-and-life-clock.html',
          ]

          success = 0
          for page in pages:
              try:
                  result = indexing_service.urlNotifications().publish(
                      body={'url': page, 'type': 'URL_UPDATED'}
                  ).execute()
                  print(f"✓ {page}")
                  success += 1
              except HttpError as e:
                  print(f"✗ {page}: {e._get_reason()}")
              time.sleep(0.5)
          
          print(f"\n{success}/{len(pages)} pages submitted")
          PYTHON

      - name: Submit sitemap to Search Console
        env:
          GSC_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GSC_KEY" > /tmp/gsc-key.json
          python3 << 'PYTHON'
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          credentials = service_account.Credentials.from_service_account_file(
              '/tmp/gsc-key.json',
              scopes=['https://www.googleapis.com/auth/webmasters']
          )
          webmasters = build('webmasters', 'v3', credentials=credentials)

          SITE_URL = 'https://creativewavecom.github.io/lifeclock/'
          try:
              # Delete old sitemap
              webmasters.sitemaps().delete(
                  siteUrl=SITE_URL,
                  feedpath='https://creativewavecom.github.io/lifeclock/sitemap.xml'
              ).execute()
              print("✓ Old sitemap deleted")
          except:
              pass

          try:
              webmasters.sitemaps().submit(
                  siteUrl=SITE_URL,
                  feedpath='https://creativewavecom.github.io/lifeclock/sitemap.xml'
              ).execute()
              print("✓ Sitemap resubmitted")
          except HttpError as e:
              print(f"✗ Sitemap submit failed: {e._get_reason()}")
          PYTHON
